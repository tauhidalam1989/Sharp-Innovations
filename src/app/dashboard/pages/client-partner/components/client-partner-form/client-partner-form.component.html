<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 text-primary fw-bold">{{isEdit ? 'Edit' : 'Add'}} {{type === 'client' ? 'Client' :
                        'Partner'}}</h5>
                </div>
                <div class="card-body">
                    <form [formGroup]="form" (ngSubmit)="onSubmit()">
                        <div class="mb-4">
                            <label class="form-label fw-medium">Name</label>
                            <input type="text" formControlName="name" class="form-control" placeholder="Enter name">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium">Logo</label>
                            <div class="d-flex align-items-center gap-4">
                                <div class="image-preview border rounded d-flex align-items-center justify-content-center"
                                    style="width: 150px; height: 100px; overflow: hidden; background: #f8f9fa;">
                                    <img *ngIf="imagePreview" [src]="imagePreview" class="img-fluid"
                                        style="max-height: 100%;">
                                    <span *ngIf="!imagePreview" class="text-muted small">No Preview</span>
                                </div>
                                <div>
                                    <input type="file" (change)="onFileSelected($event)"
                                        class="form-control form-control-sm" accept="image/*">
                                    <p class="text-muted small mb-0 mt-2">Recommended size: 200x100px (PNG/JPG)</p>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Order</label>
                                <input type="number" formControlName="order" class="form-control"
                                    placeholder="Display order">
                            </div>
                            <div class="col-md-6 d-flex align-items-end">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" formControlName="isActive"
                                        id="isActive">
                                    <label class="form-check-label" for="isActive">Is Active</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-5">
                            <button type="button" class="btn btn-light rounded-pill px-4"
                                routerLink="/dashboard/clients-partners">Cancel</button>
                            <button type="submit" class="btn btn-primary rounded-pill px-4"
                                [disabled]="submitting || form.invalid">
                                <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                                {{isEdit ? 'Update' : 'Save'}} {{type === 'client' ? 'Client' : 'Partner'}}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
