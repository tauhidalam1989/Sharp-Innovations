<div class="settings-container">
    <h2>Settings</h2>

    <div class="card">
        <div class="card-header">
            <h3>Change Password</h3>
        </div>
        <div class="card-body">
            <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
                <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
                <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

                <div class="form-group mb-3">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" class="form-control" formControlName="currentPassword">
                    <div *ngIf="passwordForm.get('currentPassword')?.touched && passwordForm.get('currentPassword')?.invalid"
                        class="text-danger small mt-1">
                        Current password is required.
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-control" formControlName="newPassword">
                    <div *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid"
                        class="text-danger small mt-1">
                        <span *ngIf="passwordForm.get('newPassword')?.errors?.['required']">New password is
                            required.</span>
                        <span *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 6
                            characters.</span>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" formControlName="confirmPassword">
                    <div *ngIf="passwordForm.get('confirmPassword')?.touched && passwordForm.get('confirmPassword')?.invalid"
                        class="text-danger small mt-1">
                        Please confirm your password.
                    </div>
                    <div *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmPassword')?.touched && !passwordForm.get('confirmPassword')?.errors?.['required']"
                        class="text-danger small mt-1">
                        Passwords do not match.
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" [disabled]="loading || passwordForm.invalid">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"
                        aria-hidden="true"></span>
                    Update Password
                </button>
            </form>
        </div>
    </div>
</div>
