<div class="user-form-container">
    <!-- Header -->
    <div class="page-header">
        <h1>{{ isEditMode ? 'Edit User' : 'Create New User' }}</h1>
        <div class="header-actions">
            <button class="btn-secondary" (click)="onCancel()">
                <i class="fas fa-times"></i>
                Cancel
            </button>
            <button class="btn-primary" (click)="onSubmit()" [disabled]="submitting">
                <i class="fas" [ngClass]="submitting ? 'fa-spinner fa-spin' : 'fa-save'"></i>
                {{ submitting ? 'Saving...' : (isEditMode ? 'Update' : 'Create') }}
            </button>
        </div>
    </div>

    <!-- Error Alert -->
    <div class="alert alert-danger" *ngIf="error">
        <i class="fas fa-exclamation-circle"></i>
        {{ error }}
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" *ngIf="loading">
        <div class="spinner"></div>
    </div>

    <!-- User Form -->
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" *ngIf="!loading" class="form-card">
        <div class="form-grid">
            <!-- Name -->
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" formControlName="name" class="form-control"
                    placeholder="Enter user's full name">
                <div class="invalid-feedback" *ngIf="userForm.get('name')?.touched && userForm.get('name')?.invalid">
                    Name is required
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" formControlName="email" class="form-control"
                    placeholder="user@example.com">
                <div class="invalid-feedback" *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid">
                    Valid email is required
                </div>
            </div>

            <!-- Password (only required for new users) -->
            <div class="form-group" *ngIf="!isEditMode">
                <label for="password">Password <span class="required">*</span></label>
                <input type="password" id="password" formControlName="password" class="form-control"
                    placeholder="Min 6 characters">
                <div class="invalid-feedback"
                    *ngIf="userForm.get('password')?.touched && userForm.get('password')?.invalid">
                    Password must be at least 6 characters
                </div>
            </div>

            <!-- Role -->
            <div class="form-group">
                <label for="role">Role <span class="required">*</span></label>
                <select id="role" formControlName="role" class="form-control">
                    <option *ngFor="let role of roles" [value]="role.value">{{ role.label }}</option>
                </select>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" formControlName="phone" class="form-control"
                    placeholder="e.g., +1234567890">
            </div>

            <!-- Status -->
            <div class="form-group">
                <label class="checkbox">
                    <input type="checkbox" formControlName="isActive">
                    <span>Active User</span>
                </label>
            </div>
        </div>
    </form>
</div>
