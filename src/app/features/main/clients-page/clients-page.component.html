<div class="clients-page py-5">
  <!-- Clients Section -->
  <div class="carousel">
    <div class="section-title ">
      <div class="header-title text-center">
        <img  src="../../../../assets/logo/SLogo.png" [height]="50">
        <h2>Our Valued Clients</h2>
      </div>
    
      <p>We're proud to partner with industry leaders across multiple sectors</p>
    </div>
    
    <owl-carousel-o [options]="clientOptions">
      <ng-container *ngFor="let logo of clientLogos">
        <ng-template carouselSlide>
          <div class="logo-item">
            <img [src]="logo" [alt]="'Client logo'" loading="lazy">
          </div>
        </ng-template>
      </ng-container>
    </owl-carousel-o>
  </div>

  <!-- Partners Section -->
  <div class="carousel">
    <div class="section-title">
      <div class="header-title">
        <img  src="../../../../assets/logo/SLogo.png" [height]="50">
        <h2>Strategic Partnerships</h2>
        </div>
   
      <p>Collaborating with technology leaders to deliver exceptional solutions</p>
    </div>
    
    <owl-carousel-o [options]="partnerOptions">
      <ng-container *ngFor="let logo of partnerLogos">
        <ng-template carouselSlide>
          <div class="logo-item">
            <img [src]="logo" [alt]="'Partner logo'" loading="lazy"  >
          </div>
        </ng-template>
      </ng-container>
    </owl-carousel-o>
  </div>

  <!-- Certificates Section -->
  <div class="carousel">
    <div class="section-title">
      <div class="header-title">
        <img  src="../../../../assets/logo/SLogo.png" [height]="50">
        <h2>Our Certifications</h2>
        </div>

 
      <p>Recognized for our commitment to quality and excellence</p>
    </div>
    
    <owl-carousel-o [options]="certificateOptions">
      <ng-container *ngFor="let cert of isocertificates">
        <ng-template carouselSlide>
          <div class="certificate-item">
            <img [src]="cert" [alt]="'ISO Certificate'" loading="lazy">
          </div>
        </ng-template>
      </ng-container>
    </owl-carousel-o>
  </div>
</div>
