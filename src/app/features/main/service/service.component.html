
    <!-- Service Start -->
<!-- Service Start -->
<div class="container-fluid bg-light py-5">
    <div class="container py-5">
      <div class="row g-5 align-items-center">
        <!-- Service Introduction Section -->
        <div class="col-lg-5 wow fadeIn" data-wow-delay="0.1s">
          <div class="btn btn-sm border rounded-pill text-primary px-3 mb-3">
            {{ 'SERVICE.OUR_SERVICES' | translate }}
          </div>
          <h1 class="mb-4">{{ 'SERVICE.TITLE' | translate }}</h1>
          <p class="mb-4">{{ 'SERVICE.DESCRIPTION' | translate }}</p>
          <a class="btn btn-primary rounded-pill px-4" href="">
            {{ 'SERVICE.READ_MORE' | translate }}
          </a>
        </div>
  
        <!-- Service List Section -->
        <div class="col-lg-7">
          <div class="row g-4">
            <div *ngFor="let service of servicesList; let i = index" class="col-md-6">
              <div class="service-item d-flex flex-column justify-content-center text-center rounded wow fadeIn" [attr.data-wow-delay]="service.delay">
                <div class="service-icon btn-square">
                  <i [class]="service.icon"></i>
                </div>
                <h5 class="mb-3">{{ service.title | translate }}</h5>
                <p>{{ service.description | translate }}</p>
                <a class="btn px-3 mt-auto mx-auto" href="">{{ 'SERVICE.READ_MORE' | translate }}</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Service End -->

     <team *ngIf="!isHome"></team>
     <testimonial *ngIf="!isHome"></testimonial>
