
<!-- About Start -->
<div data-aos="animation_name" class="container-fluid">
    <div class="container">
        <div class="row g-5 align-items-center">
            <!-- Image Section -->
            <div class="col-lg-6 wow fadeIn" [attr.data-wow-delay]="'0.1s'">
                <div class="">
                    <img class="img-fluid" *ngIf="imageSrc" [src]="imageSrc" alt="About Image">
                </div>
            </div>
            <!-- Content Section -->
            <div class="col-lg-6 wow fadeIn" [attr.data-wow-delay]="'0.5s'">
                <div class="btn btn-sm border rounded-pill text-primary px-3 mb-3">{{ 'ABOUT_US' | translate }}</div>
                <h1 class="mb-4">
                    {{ 'WELCOME_MESSAGE' | translate }}
                </h1>
                <p class="mb-4">{{ 'about_page.p1' | translate }}</p>
                <p class="mb-4">
                    {{ 'about_page.p2' | translate }}
                </p>
                <p class="mb-4">
                    {{ 'about_page.p3' | translate }}
                </p>
               
                <div class="d-flex align-items-center mt-4">
                    <a class="btn btn-primary rounded-pill px-4 me-3" routerLink="/about-more">{{ 'READ_MORE' | translate }}</a>
                    <a class="btn btn-outline-primary btn-square me-3" href="#"><i class="fab fa-facebook-f"></i></a>
                    <a class="btn btn-outline-primary btn-square me-3" href="#"><i class="fab fa-twitter"></i></a>
                    <a class="btn btn-outline-primary btn-square me-3" href="#"><i class="fab fa-instagram"></i></a>
                    <a class="btn btn-outline-primary btn-square me-3" href="#"><i class="fab fa-linkedin-in"></i></a>
                </div>
   
            </div>
            <app-core-service></app-core-service>
    </div>
</div>
<!-- About End -->

 <feature *ngIf="!isHome"></feature>
 <!-- <team *ngIf="!isHome"></team> -->
 <newsletter *ngIf="!isHome"></newsletter>
