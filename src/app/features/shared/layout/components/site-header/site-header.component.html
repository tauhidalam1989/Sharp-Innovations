<div class="container-fluid sticky-top">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3JLR6G6RLB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-3JLR6G6RLB');
  </script>
  <div class="container">
    <nav class="navbar navbar-expand-lg navbar-dark p-0 cursor-pointer">
      <a class="cursor-pointer" (click)="pathService.navigateToAbout('home')" class="navbar-brand">
        <!-- <h1 class="text-white">{{ 'TITLE' | translate }}</h1> -->
        <img [height]="60" [src]="imageSrc" alt="" srcset="">
      </a>
      <button type="button" class="navbar-toggler ms-auto me-0" (click)="toggleSidebar.emit()">
        <span class="navbar-toggler-icon"></span>
      </button>
      <!-- Brand -->

      <!-- Mobile Toggle Button -->

      <!-- Navbar Links -->
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <div class="navbar-nav ms-auto">
          <!-- Other Links -->
          <a routerLink="/home" routerLinkActive="active" class="nav-item nav-link">
            {{ 'HOME' | translate }}
          </a>
          <a routerLink="/about" routerLinkActive="active" class="nav-item nav-link">
            {{ 'ABOUT' | translate }}
          </a>

          <!-- SERVICES Link -->
          <a routerLink="/service-pages" routerLinkActive="active" class="nav-item nav-link">
            {{ 'SERVICES' | translate }}
          </a>
          <!-- PRODUCTS Link -->
          <a routerLink="/products" routerLinkActive="active" class="nav-item nav-link">
            {{ 'PRODUCTS' | translate }}
          </a>

          <a routerLink="/Careers" routerLinkActive="active" class="nav-item nav-link">
            {{ 'CAREERS' | translate }}
          </a>
          <a routerLink="/contact" routerLinkActive="active" class="nav-item nav-link">
            {{ 'CONTACT' | translate }}
          </a>
          <a routerLink="/blogs" routerLinkActive="active" class="nav-item nav-link">
            {{ currentLang === 'ar' ? 'المدونات' : 'Blogs' }}
          </a>
          <a class="cursor-pointer" (click)="switchLanguage(currentLang === 'en' ? 'ar' : 'en')"
            routerLinkActive="active" class="nav-item nav-link cursor-pointer">
            {{ currentLang === 'ar' ? 'English': 'عربي' }}
          </a>

          <!-- Language Toggle Switch -->

        </div>
      </div>
    </nav>
  </div>
</div>
